# gorge's pipeline on agentctl (plan-slice5 Task 5.14).
#
# Every value below reproduces gorge's orchestrator/config.py, gates.py and
# daemon.py as of the 2026-09-19 snapshot (gorge HEAD 1c83cd12, working tree);
# tests/test_consumer_parity.py in agentctl pins that. Change a value here,
# not in agentctl. Per-tick knobs (seats, caps, max_minutes) are overridden
# live through the dash (.ds4/orchestrator/overrides.json), not by editing
# this file.

[repo]
base_branch = "main"
state_dir = ".ds4"
worktrees_dir = ".worktrees"

# config.py:45-57, 96-98; seats.py:121 hard-codes the escalated thinking.
# 2026-09-24 (operator): [[tiers]] replace the five fixed seat roles (agentctl
# tiered dispatch, slice 2). "DeepSeek as implementer, local glm for review and
# triage." Each job tries free tiers first, then paid tiers in this order. Jobs,
# rounds, thinking, order and caps are editable live from the dash's Seats
# section (overrides.json); provider/model/paid/tag_prefix are TOML-only.
# Replaced: [seats.*], [seats.allow], [caps.models], policy.max_local_rounds
# (2) and policy.max_escalated_rounds (3) -- the ladder is now DeepSeek high x3
# then DeepSeek max x2 (5 rounds, as before). Codex tiers are declared at cap 0
# so they can be switched on from the dash without a restart.
[[tiers]]
name = "glm"
harness = "opencode"
provider = "bm-llms-glm"
model = "GLM-5.3-Flash"
thinking = "high"
paid = false
cap = 3
# 2026-09-28: glm is now the FIRST implement rung, not just review/triage.
# It is free and sorts first, so every ticket gets two local rounds before any
# paid seat is spent. The engine behind it (GLM-5.3-Flash NVFP4 on vLLM TP2)
# serves a 899,579-token KV pool with 4 request slots; cap 3 leaves a slot for
# the review/triage seats that also land here. Concurrency past the slot count
# QUEUES rather than deadlocking -- measured: 4 x 70k and even 2 x 465k
# contexts all complete, because --max-parallel-prefills 1 serialises prefill.
rounds = 2
tag_prefix = "r"
tasks = ["implement", "review", "triage"]

[[tiers]]
name = "deepseek"
harness = "opencode"
provider = "deepinfra"
model = "deepseek-ai/DeepSeek-V4.1-Flash"
thinking = "high"
paid = true
cap = 4
rounds = 3
tag_prefix = "t"
tasks = ["implement", "merge-fix", "wide-sweep"]

[[tiers]]
name = "deepseek-max"
harness = "opencode"
provider = "deepinfra"
model = "deepseek-ai/DeepSeek-V4.1-Flash"
thinking = "max"
paid = true
cap = 4
rounds = 2
tag_prefix = "tm"
tasks = ["implement"]

[[tiers]]
name = "luna"
provider = "openai-codex"
model = "gpt-6-luna"
thinking = "medium"
paid = true
cap = 0
rounds = 0
tag_prefix = "l"
tasks = ["review", "triage"]

[[tiers]]
name = "sol"
provider = "openai-codex"
# 2026-10-05: gpt-6.1-sol (DevDay 2026-09-29) replaced gpt-6-sol.
# 2026-10-06 (operator): the ChatGPT account pi is logged into rejects every
# sol model ("not supported when using Codex with a ChatGPT account"), so this
# tier runs gpt-5.6-terra (smoke-tested via pi). Name and tag prefix kept so
# in-flight round tags stay valid; restore gpt-6.1-sol when sol is back.
model = "gpt-5.6-terra"
thinking = "high"
paid = true
cap = 0
rounds = 0
tag_prefix = "sol"
tasks = ["implement", "review"]

# 2026-10-05 (operator): Claude Code CLI seats on the operator's
# subscription (agentctl ClaudeHarness, provider "claude-cli"). paid = true so
# they sort AFTER every pay-per-token tier: the last rungs of the implement
# ladder, after sol. cap 1 each: these seats share the weekly quota with the
# operator's own Claude Code session.
[[tiers]]
name = "claude-sonnet"
provider = "claude-cli"
model = "claude-sonnet-5-5"
thinking = "medium"
paid = true
cap = 1
rounds = 1
tag_prefix = "cs"
tasks = ["implement"]

[[tiers]]
name = "claude-opus"
provider = "claude-cli"
model = "claude-opus-5-5"
thinking = "medium"
paid = true
cap = 1
rounds = 1
tag_prefix = "co"
tasks = ["implement"]

[policy]
# 2026-09-24 (operator): false -- seats.local is DeepSeek now; reviews stay on glm.
review_local_fallback = false
review_local_thinking = "high"
# 2026-09-22 (operator): false. With the fallback on, 51 escalated rounds in
# 48h ran on local glm-flash because the DeepInfra cap was full, so the
# ladder's LAST chance ran on its weakest seat and exhausted straight into
# human_needed. An escalated round now waits for a paid slot instead.
escalation_local_fallback = false
# 2026-09-29: true. The 2026-09-24 `false` was written while seats.local was
# DeepSeek -- the probe would then have hit deepinfra with the local key and
# held every implementer as DOWN. That premise is gone: [[tiers]] derives
# `local` as the first unpaid implement tier, which is now the glm tier
# (tiered dispatch slice 2), so the probe hits the local glm engine it exists
# to watch. With it off, agentctl (daemon.py:52) substitutes `probe = lambda p:
# True` and context.py:219 stops gating free-pool launches, so a down engine is
# never seen: every launch runs, produces nothing, and journals one
# provider_failure -- 87 in 30 minutes on 2026-09-29T23:1xZ. The probe
# classifies 503 as DOWN (outcome.py:311), so on it holds the free pool
# instead. This also restores parity with agentctl's canonical copy
# (consumers/gorge/config.toml:54, true) and its golden
# (tests/test_consumer_parity.py:150, assertTrue -- "daemon.py:209 always
# probes").
local_endpoint_probe = true
# 2026-09-20 (operator): "stop taking all new tickets into local or paid jobs
# until needs-human or blocked jobs are resolved". While any ticket sits in
# human_needed, no `new` or `briefed` ticket starts; in-flight work still
# advances, so the fleet drains instead of growing.
# 2026-09-22 (operator): measured 686 of the last 1440 minutes on hold (11
# human_needed tickets in 24h, each freezing every new dispatch until a hand
# landing finished); the 20-min health check now lands parked tickets with an
# Opus agent, so the drain-while-parked policy costs more than it saves.
hold_new_while_parked = false
# 2026-09-22 (operator: "tackle WAITING/REVIEW before any new tickets; set it
# to 5"): while more than this many tickets sit in `waiting` (a fix round due,
# queued for a seat) or `review`, no `new`/`briefed` ticket starts; in-flight
# work keeps advancing and drains the backlog. Measured that day: 22 waiting
# behind the overflow rounds fresh tickets kept spawning. Needs agentctl pin
# >= the commit that adds the key.
hold_new_while_waiting_over = 20
# 2026-09-22 (operator): triage writes at most this many briefs ahead of the
# implementers; no new triage launches while this many sit in `briefed`.
triage_ahead = 100

# 2026-09-19 (operator): the escalated tier is held for Claude. 0 means ONE
# DeepSeek escalated round after the local rounds (the ladder launches the first
# escalated round before it checks the cap), then human_needed, which a Claude
# operator session picks up with ~/projects/agentctl/docs/claude-operator-prompt.md.
# max_escalated_rounds = 5
# 2026-09-22 (operator): 3 escalated rounds (handle_failure checks the cap AFTER
# the round counter increments, so N means N rounds for N >= 1). Measured over the
# previous 48h: 26 of 34 human_needed entries were "review/gate failed and
# escalation ladder exhausted", 20 of the last 25 a REQUEST_CHANGES at the
# single escalated round, and a batch of 17 tickets queued at 15:08Z hit
# that wall together between 17:00 and 19:50Z (15 exhaustions in 3h).
# The Claude hand-landing path is the safety valve, not the pipeline.
# 2026-09-23 (operator): 3. Measured that morning, six tickets reached
# human_needed in forty minutes, and 55 of the previous 56 blocks were
# "escalation ladder exhausted". Nearly every round of those six ended
# DONE_WITH_CONCERNS -- one on all six rounds, another on five -- because each
# brief asked for a whole multi-part Known-approximations row and no round
# could close all of it. The seat said so every time and the ladder spent the
# rounds anyway. A third self-declared incomplete round now parks the ticket
# with `brief_too_broad` so the brief gets split, instead of burning the
# remaining paid rounds on a scope no round can close.
concerns_rounds_before_park = 3
max_merge_rounds = 2
seat_start_grace_s = 180
# 2026-09-22 (operator): tick every 10s.
poll_seconds = 10

# config.py:75, 90-91.
# 2026-09-21 (operator): "2 local, 5 paid".
[caps]
# 2026-09-24 (operator): under [[tiers]] the free pool is the glm tier. Was 2, then 4.
local = 3
# 2026-09-22 (operator): the paid pool is sized to hold every per-model cap
# below at once; [caps.models] does the real bounding, so one paid provider
# can no longer fill the pool and push codex reviews onto the local seat.
# Raised to 12 with luna (4) joining the per-model caps.
# 2026-09-24 (operator): DeepSeek implementers ride the "local" pool (caps.local);
# the paid pool now holds the glm reviewer/triage seats (they differ from
# seats.local, so they count as paid) plus DeepSeek overflow/escalation.
# [caps.models] bounds each model: glm 3, DeepSeek 4. Was 12, then 0.
paid = 4
max_minutes = 75

[dispatch]
context_file = ".superpowers/ds4/gorge-context.md"
tails_dir = ".superpowers/ds4"

# config.py:17-19; daemon.py:62-80, 153-180.
[intake]
inbox = true
agent_tickets = true
feedback_dir = "feedback"

[intake.routes]
# Cross-repository work is routed only through an explicit, operator-owned
# alias. A seat may name this alias in Owner-Repo but never supplies a path.
agentctl = "/home/sadams/projects/agentctl"

# git_ops.py:27-37 (create_worktree), :58-67 (triage), :80-86 (node_modules),
# :231-237.
[worktree]
copy = [".ds4/ledger.json", ".ds4/MagicCompRules-20260807.txt"]
link = [".cards", ".superpowers"]
hardlink = ["web/node_modules"]
ignore_uncommitted = []

# gates.py:114-148, in order; each gate's argv/timeout/env/cwd is gates.py:34-103.

# 2026-10-04: ratchets-only-fall (scripts/ratchet_gate.py). FIRST and cheap
# (git + a stdlib Python tokenizer, well under a second): it fails a branch
# that raises or deletes a shrink-only ratchet constant, widens an allow-list,
# drops or rewires a TestCodeShapeOnlyShrinks row, adds a longFuncCeilings key
# or raises its value, adds a known-unsupported entry, or edits the gate
# itself -- all measured against merge-base({base}, HEAD). The script runs
# from the BASE copy (`git show {base}:...`), so a branch cannot weaken the
# gate that judges it; pipefail makes a missing base copy a failure rather
# than an empty, passing stdin. There is no escape trailer: the operator
# raises a ratchet by landing it by hand. Deliberately NOT a [mechanical]
# pattern: a raised ratchet is never bookkeeping.
# 2026-10-05: an XMage driver change is landed by a host operator, never by
# the pipeline. Seats cannot run XMage, and 7883f6b25 merged a driver change
# that turned every Standard scenario into a harness failure (4944 rows) until
# a host full replay caught it. A branch touching tools/xmageoracle/ fails here
# and parks; scripts/driver_replay_batch.sh (unit gorge-driver-replay-batch)
# batches every parked ticket, runs ONE validation/oracle/full-replay.sh,
# compares verdicts against main and lands them (2026-10-06; before that an
# operator did this by hand, .ds4/operator-compliance-refresh.md).
[[gates]]
name = "xmage driver needs host replay"
cmd = ["bash", "-c", "set -o pipefail; changed=$(git diff --name-only $(git merge-base {base} HEAD) HEAD -- tools/xmageoracle/); if [ -n \"$changed\" ]; then echo \"XMAGE DRIVER CHANGED -- parked for scripts/driver_replay_batch.sh (gorge-driver-replay-batch):\"; echo \"$changed\"; exit 1; fi; echo 'xmage driver untouched'"]
timeout = 60
# Only an operator host full replay + hand landing clears this gate; a seat
# fix round cannot (2026-10-05: four tickets looped 8-10 paid sol rounds on it).
on_fail = "park"

[[gates]]
name = "ratchets only fall"
cmd = ["bash", "-c", "set -o pipefail; git show {base}:scripts/ratchet_gate.py | python3 - {base}"]
timeout = 60

# 2026-09-29: the resource broker's gate bracket (design
# docs/superpowers/specs/2026-09-29-reward-loop-and-seed-agent-design.md §3.2).
# This gate runs FIRST and pauses every heavy and probe lease, so the whole
# suite below runs without a training run or a sweep competing for memory --
# two OOMs on 2026-09-27 were exactly that collision. The release half is
# orchestrator.hooks:testheads_policy's gate-end call, and broker.sh expires an
# abandoned flag after GATE_FLAG_TTL_S so a crashed tick cannot strand heavy
# work paused. It cannot fail a landing: the script exits 0 whether or not any
# lease exists.
[[gates]]
name = "broker gate-begin"
cmd = ["scripts/broker.sh", "gate-begin"]
timeout = 60
# A gate runs in the seat's WORKTREE, whose own .ds4/reward is empty, so the
# state dir is pinned to the main checkout where the leases actually live.
env = { GORGE_REWARD_DIR = "/home/sadams/projects/gorge/.ds4/reward" }

# 2026-09-30 (cli-20260930T021924Z-01e737bb): every go gate below now carries a
# CPU ceiling alongside MemoryMax. Without one a single gate round burst to
# 18-25 vCPU (go vet hit 766-1009%) on top of the training/sweep work on this
# box. CPUQuota is the right knob: on go1.25+ the Go runtime reads the scope
# cgroup's cpu.max at process start, so the quota caps GOMAXPROCS, go test/build
# -p and the cgroup scheduler at once. AllowedCPUs does NOT (measured on this
# box: CPUQuota=200% -> GOMAXPROCS 2, AllowedCPUs=0-3 -> GOMAXPROCS 32; both
# exit 0 in a user scope). 400% matches the go build gate; the serial gates (CR
# conformance, TestHeads, make sim) get 200%, ample for -p=1.
#
# 2026-10-03 (cli-20261003T071718Z-870e76ee): the vet gate is raised to 800%
# (GOMAXPROCS 6, -p=6). The cold vet is CPU-QUOTA-bound, not -p-bound: at a
# fixed 400% quota, -p above 2 is noise or worse. Measured with a private
# empty GOCACHE (the shared cache is warm and tells you nothing), each run in
# the gate's own systemd scope under `MemoryMax=4G GOMEMLIMIT=1GiB`:
#   -p=2 CPUQuota=400% GOMAXPROCS=4 -> 60.9s / 61.3s, 350% CPU, 1.90G maxRSS
#   -p=4 CPUQuota=400% GOMAXPROCS=4 -> 57.8s,              383% CPU, 1.92G maxRSS
#   -p=6 CPUQuota=400% GOMAXPROCS=4 -> 60.3s,              383% CPU, 1.93G maxRSS
#   -p=8 CPUQuota=400% GOMAXPROCS=4 -> 66.6s,              378% CPU, 1.92G maxRSS
#   -p=4 CPUQuota=800% GOMAXPROCS=4 -> 45.8s / 45.5s,      504% CPU, 1.93G maxRSS
#   -p=6 CPUQuota=800% GOMAXPROCS=6 -> 38.4s / 40.2s,  616-624% CPU, 1.88G maxRSS
#   -p=8 CPUQuota=800% GOMAXPROCS=8 -> 41.0s / 40.8s,  657-682% CPU, 1.87G maxRSS
# -p=6 at 800% is the knee (~39s); -p=8 is no faster and burns more CPU. Peak
# RSS stays ~1.9G, well under MemoryMax=4G. Net: ~61s -> ~39s cold. The module
# gate keeps its own -p=4/800% (see the block above), unchanged by this.
# GOMAXPROCS in env is the legible belt-and-braces for the parallel gates.
#
# 2026-10-05 (gate-vet1): raise the vet memory limit to stop GC thrash on
# cache misses, then give the less GC-bound run more CPU. Measured in this
# worktree, in the gate's systemd scope (cold = private empty GOCACHE; miss =
# fresh rules/engine.go content with shared cache):
#   old 4G / 800% / -p=6 / GOMAXPROCS=6 / 1GiB -> cold 60.26s, 1.83GiB RSS;
#                                                   miss 56.63s, 1.80GiB RSS
#   new 8G / 1600% / -p=8 / GOMAXPROCS=8 / 4GiB -> cold 45.98s, 3.13GiB RSS;
#                                                   miss 19.87s, 2.92GiB RSS
# Warm repeat: 1.18s, 76MiB RSS. Vet is content-cached: fleet logs had 25/40
# runs at 0-2s, not a fixed ~50s/run. The higher memory cap cuts GC-bound miss
# work; the higher CPU quota/parallelism further reduces cold time. Peak RSS
# remains below MemoryMax=8G.
#
# 2026-10-03 (cli-20261003T052434Z-a1d15fb3): the module gate's CPUQuota is
# raised to 800% (GOMAXPROCS 8, -p=4 kept). Measured, forced fresh
# (`go test -p=4 -count=1 -skip ... ./...` in the systemd scope, both runs
# with this tree):
#   CPUQuota=400% GOMAXPROCS=4 -> 192.4s wall, 719.8s user, 0 FAIL
#   CPUQuota=800% GOMAXPROCS=8 -> 114.1s wall, 722.9s user, 6.16G maxRSS, 0 FAIL
# The gate was CPU-quota-bound, not memory-bound: it already spent ~3.7 of its
# 4 quota-cores (719.8s user / 192.4s wall), so the extra 4 cores cut the wall
# 40% with the SAME total work. -p=4 is kept, so at most four test binaries
# are resident and peak RSS stays 6.16G under the existing 8G MemoryMax (the
# box has 58G; two overlapping gates at 8G each fit). 8 vCPU is also well
# under the 18-25 vCPU burst that motivated the 2026-09-30 ceilings, and the
# broker's gate-begin pauses heavy/probe leases for the whole suite.

[[gates]]
name = "go build"
cmd = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=8G", "-p", "CPUQuota=800%", "go", "build", "./..."]
timeout = 900
env = { GOMEMLIMIT = "1GiB", GOMAXPROCS = "4", GOFLAGS = "-p=2 -trimpath" }

[[gates]]
# 2026-10-05 (operator): per-ticket validation cut to 1-2 min. The old module
# gate (go vet ./... + go test ./..., 300-500s under fleet load) moved to the
# post-merge full suite (scripts/postmerge_full.sh), run on main after
# landings; a red there is bisected and fixed at once. This gate tests ./rules
# (minus four whole-corpus censuses, which run post-merge), the Kr8 pair in
# their own processes, ./view, ./internal/codeshape and every package the
# branch touched. Run from the BASE copy so a branch cannot edit its own gate.
name = "go test (affected)"
cmd = ["bash", "-c", "set -o pipefail; if [ -n \"${GORGE_HEAVY_LOCK:-}\" ]; then lock=\"$GORGE_HEAVY_LOCK\"; else common=\"$(git rev-parse --path-format=absolute --git-common-dir)\"; lock=\"$(dirname \"$common\")/.ds4/heavy.lock\"; fi; lanes=${GORGE_HEAVY_LANES:-2}; mkdir -p \"$(dirname \"$lock\")\"; acquired=; deadline=$(( $(date +%s) + 1500 )); while [ -z \"$acquired\" ]; do i=1; while [ \"$i\" -le \"$lanes\" ]; do f=\"$lock\"; [ \"$i\" = 1 ] || f=\"$lock.lane$i\"; : >>\"$f\" 2>/dev/null || { i=$((i+1)); continue; }; exec 9>>\"$f\"; if flock -n 9 2>/dev/null; then acquired=\"$f\"; break; fi; i=$((i+1)); done; if [ -z \"$acquired\" ]; then now=$(date +%s); if [ \"$now\" -lt \"$deadline\" ]; then rem=$(( deadline - now )); [ \"$rem\" -gt 5 ] && rem=5; sleep \"$rem\" 9>&-; else echo \"gate: every heavy lane of $lock still held after 1500s; affected gate not run\" >&2; exit 75; fi; fi; done; systemd-run --user --scope -q -p MemoryMax=16G -p CPUQuota=1600% bash -c 'set -o pipefail; git show {base}:scripts/gate_affected.sh | bash -s {base}'; rc=$?; exit \"$rc\""]
# 2026-10-05 (operator): this gate is HEAVY-class work, so it takes a lane of
# the repo heavy pool like postmerge_batch.sh and heavy.sh. The lane
# acquisition is INLINED here: the path is derived inline from the shared git
# common dir (`git rev-parse --git-common-dir`), exactly as
# scripts/heavy_lock.sh does, and the lane scan is the same first-free lane
# over GORGE_HEAVY_LANES lanes with lane 1 = the base file (2026-10-09: the
# single lock became a 2-lane pool when the box went to 120 GiB, so this gate
# and the post-merge full suite can run at the same time). It is inlined
# because no branch-only file has to come from {base} (extracting a helper
# that did not exist in `main` failed the extraction on the ticket that
# introduced it). A branch still cannot weaken this: nothing here is read from
# the branch, and {base} is only used to fetch scripts/gate_affected.sh as
# before. GORGE_HEAVY_LOCK overrides the base path (tests/operators). The
# lane fd (9) is held by THIS bash, which then runs systemd-run as a child:
# the child inherits the open fd (and the lock on it, flock being a property
# of the open file description), so the lane is held for exactly the gate's
# lifetime and is released when this bash exits after capturing the child's
# rc. The old `flock -o` (fd never reaches the child) is deliberately gone:
# nothing inside gate_affected.sh takes the heavy pool, so an inherited fd
# cannot pin anything beyond the gate itself. The wait is BOUNDED: 1500 s
# scanning the lanes every ≤5 s, never running past the deadline (exit 75,
# command not run, gate red with a "still held" line) on top of the old 600 s
# run budget. A heavy.sh lease
# cannot make it wait on a frozen job: the gate-begin bracket above pauses
# every lease and a parked lease yields its lane (heavy.sh supervisor). A
# heavy.sh job still PARKED in the broker wait (gate active, so `may-i`
# refuses) holds no lane either: heavy.sh asks the broker BEFORE it takes a
# lane. What it can wait on is a running post-merge full suite, which holds a
# lane for its whole length and is never paused — with 2 lanes the other lane
# stays free for a lease meanwhile.
#
# gate_affected bounds the test phase to four concurrent test binaries
# (each invocation uses -p=1); its vet phase is sequential and uses -p=2.
# Four binaries x 1536MiB stays below the 8G scope with headroom. The
# measured >2GiB test exceptions are pinned (shrink-only) in
# internal/testutil/testdata/rss_exceptions.txt; the operator must remeasure
# both full scopes before enabling these proposed limits.
timeout = 2100
env = { GOMEMLIMIT = "1536MiB", GOMAXPROCS = "2", GOGC = "200", GOFLAGS = "-p=2 -trimpath" }

[[gates]]
name = "CR conformance"
cmd = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=8G", "-p", "CPUQuota=800%", "go", "test", "-p=1", "./rules", "-run", "TestCR", "-v"]
timeout = 300
# GOGC=200: same setting as the module gate above, for the same reason -- this
# runs the same rules test binary, whose GC cost GOGC=200 cuts ~20%.
env = { GORGE_CR_CONFORMANCE = "1", GOMEMLIMIT = "1GiB", GOGC = "200", GOFLAGS = "-p=2 -trimpath" }
accept = "orchestrator.hooks:cr_no_fail_lines"

[[gates]]
name = "TestHeads"
cmd = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=8G", "-p", "CPUQuota=800%", "go", "test", "./rules", "-run", "TestHeads", "-v"]
timeout = 120
# GOGC=200: as for the module and CR gates -- same rules test binary.
env = { GOMEMLIMIT = "1GiB", GOGC = "200", GOFLAGS = "-p=2 -trimpath" }
blocking = false          # the TestHeads policy (hooks.testheads_policy) decides

[[gates]]
name = "make sim"
cmd = ["systemd-run", "--user", "--scope", "-q", "-p", "MemoryMax=8G", "-p", "CPUQuota=800%", "make", "sim"]
timeout = 600
env = { GOMEMLIMIT = "1GiB", GOFLAGS = "-p=2 -trimpath" }
accept = "orchestrator.hooks:sim_all_replayed"

[[gates]]
name = "npm run check"
cmd = ["npm", "run", "check"]
cwd = "web"
timeout = 300
applies_diff_touches = "web/"

[[gates]]
name = "npm test"
cmd = ["npm", "test"]
cwd = "web"
timeout = 300
retries = 1               # gates.py:80-91: one retry for layout-probe flakes, never more
applies_diff_touches = "web/"

[[gates]]
name = "npm run build"
cmd = ["npm", "run", "build"]
cwd = "web"
timeout = 300
applies_diff_touches = "web/"

[[gates]]
name = "smoke"
cmd = ["flock", "{orch_dir}/smoke.lock", "bash", "scripts/smoke.sh"]
timeout = 1200
# 8090-8099 is the shared task-server allocation and presently has only four
# free ports.  This private gate farm needs five; keep it out of that pool.
env = { SMOKE_PORT_LO = "8100", SMOKE_PORT_HI = "8199" }
applies_diff_touches = "web/"

# Bookkeeping gate failures go to the REVIEWER seat in mechanical-fix mode
# (agentctl spec docs/superpowers/specs/2026-09-23-tiered-dispatch-design.md
# §2): a post-rebase gate run whose EVERY failing `--- FAIL:` block matches one
# of these patterns is a census/ratchet/golden edit, not a defect. The reviewer
# makes the edit the test names, commits, and the gate re-runs; the round is not
# counted against the ladder. Patterns are measured from the gate logs of
# 2026-09-22, when 14 of 21 gate failures were this class and eight tickets
# parked on them. `all` blocks must match: a run mixing a census failure with a
# real test goes to the ordinary ladder. A run where a census test PANICS is
# deliberately not covered (the three 20:05-21:26Z runs): a panic can never be
# classified as bookkeeping. max_rounds = 0 turns the lane off.
[mechanical]
max_rounds = 2
patterns = [
  "paramcensus rot guard",
  "which is not in knownUnsupportedParams -- new gap",
  "param census: [0-9]+ of [0-9]+ distinct repo-deck cards carry",
  "still over-suppresses this API's gap",
  "Known-approximations rows exceed the [0-9]+-byte Stand-in cap",
  "registered but not expanded before the split",
  "kind [A-Za-z_]+ interest = [0-9]+, want [0-9]+",
  "teacher output moved: digest",
  "sampler output moved: digest",
]

# daemon.py:869-921; git_ops.py:205-216.
[landing]
staging_worktree = true
strategy = "merge-push"
remote = "origin"
push = false
# 2026-10-05 (operator): main is pushed by scripts/postmerge_batch.sh only
# after the full suite passes, every 5 landings (or 60 min).
# 2026-09-22 (operator): the demo is no longer redeployed on every merge --
# a redeploy kills every in-flight vs-bot game (SIGTERM aborts live matches
# and the persistence dir is wiped). Deploy by hand: `make deploy-demo`.
deploy_cmd = []
# make ledger serialises on its OWN lock (.ds4/ledger.lock, scripts/ledger-lane.sh),
# never the shared heavy lock (operator, 2026-10-06): behind benches and full
# suites it stalled every merge. It waits at most 300 s; a failure only logs.
post_merge = [["env", "LEDGER_LANE_WAIT=300", "make", "ledger"]]
carry_trailers = []

# config.py:35, 138-163.
[harness]
pi_agent = "~/projects/ds4-harness/bin/pi-agent"
models_json = "~/.pi/agent/models.json"
probe_key_env = "BM_LLMS_API_KEY"

[harness.env_from_cmd.BM_LLMS_API_KEY]
cmd = ["kubectl", "--context", "k3d-bm", "-n", "llm-system", "get", "secret", "bm-llms-secrets", "-o", "jsonpath={.data.apiToken}"]
decode = "base64"

[hooks]
post_gates = "orchestrator.hooks:testheads_policy"

# 2026-10-05 (operator): every seat runs in its own capped systemd scope
# (agentctl 36c55ec/652bf8a; defaults MemoryMax=4G, CPUQuota=200%,
# GOMAXPROCS=2, GOMEMLIMIT=1536MiB). The env table replaces the defaults, so
# it restates them. GOFLAGS adds -trimpath: without it every worktree's
# absolute path is in every compile's cache key and no seat reuses another's
# builds (measured: 0 cross-worktree hits; 4/5 with -trimpath).
# 2026-10-06 (operator): compiles get 4 CPUs. ./rules is one 118k-line
# package and the compiler parallelises it only up to GOMAXPROCS (max 4);
# at 2 a seat's cold rules compile took ~1 min. Test runs keep their budget
# through their own capped scope (AGENTS.md test command).
# 2026-10-09 (operator): GOMEMLIMIT doubles to 3GiB with the per-test budget
# (4 GiB RSS / 4 vCPU); the seat scope's hard caps already cover it.
[seats.scope]
memory_max = "8G"
cpu_quota = "800%"
env = { GOMAXPROCS = "4", GOMEMLIMIT = "3GiB", GOFLAGS = "-p=2 -trimpath" }
