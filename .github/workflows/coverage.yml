# Publish the card-coverage tables for every push to main.
#
# The measurement needs the Forge corpus, which is GPL-3.0 and is never
# committed here: the job fetches it at the FORGE_REF pin into the gitignored
# .cards/ and throws it away with the runner.
#
# The tables are generated, NEVER committed (W2 of the 2026-10-03 lasagna
# spec). This job used to commit README.md and docs/coverage.md back to main
# -- 90 bot commits in 14 days that every live branch rebased across. It now
# publishes on the run page instead: .coverage/summary.md plus the full
# .coverage/coverage.md as the job summary, and .coverage/ as the
# `card-coverage` artifact. Only counts and percentages are published, no card
# text. It needs no secrets and only read access to the repository.
name: card coverage

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest push's tables matter, and nothing is written back, so an
# in-flight run is safe to cancel.
concurrency:
  group: card-coverage
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ~25 MB sparse checkout of FORGE_REPO (gorge's fork of Card-Forge/forge) at the Makefile's FORGE_REF.
      - name: Fetch the Forge corpus
        run: make fetch-cards

      - name: Generate the coverage tables
        run: make coverage

      - name: Publish the tables as the job summary
        run: |
          set -euo pipefail
          {
            echo "# Card coverage"
            echo
            cat .coverage/summary.md
            echo
            echo "---"
            echo
            cat .coverage/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tables
        uses: actions/upload-artifact@v4
        with:
          name: card-coverage
          path: .coverage/
          if-no-files-found: error
